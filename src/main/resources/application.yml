server:
  port: 8080
  forward-headers-strategy: none
spring:
  application:
    name: stu-system
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
    generator:
      write-numbers-as-strings: true
  flyway:
    enabled: true
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
