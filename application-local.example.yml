spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stu_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
  data:
    redis:
      host: localhost
      port: 6379

student:
  avatar:
    provider: local
    local-root: ${java.io.tmpdir}/stu-system/avatars
    cos-region: ${COS_REGION:}
    cos-bucket: ${COS_BUCKET:}
    cos-secret-id: ${COS_SECRET_ID:}
    cos-secret-key: ${COS_SECRET_KEY:}

# Tencent Cloud COS is intentionally unconfigured until credentials and settings are provided.
